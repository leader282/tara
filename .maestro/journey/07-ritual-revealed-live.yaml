appId: com.leader282.tara
name: "Journey: first partner sees the reveal and its timeline moment arrive live"
tags:
  - journey
  - rituals
  - realtime
---
# Still on the rituals tab from answering first, and no launchApp (which would refetch),
# so the reveal has to arrive over realtime.
- extendedWaitUntil:
    visible: "Both answers are revealed"
    timeout: 60000
- scrollUntilVisible:
    element: ${J_PARTNER_RITUAL_ANSWER}
    direction: DOWN
    timeout: 10000

# Today's ritual has its own card, so history only lists earlier days.
- scrollUntilVisible:
    element: "Ritual history"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element: "No past rituals yet"
    direction: DOWN
    timeout: 10000

# The reveal's timeline moment arrives live too.
- tapOn:
    id: "tab-timeline"
- extendedWaitUntil:
    visible: "Your private timeline"
    timeout: 20000
- extendedWaitUntil:
    visible: "Ritual completed: .*"
    timeout: 30000
