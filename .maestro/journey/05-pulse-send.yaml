appId: com.leader282.tara
name: "Journey: send a presence pulse with a note"
tags:
  - journey
  - presence
---
- runFlow: ../shared/resume-to-tabs.yaml
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "couple-home"
    timeout: 20000
- scrollUntilVisible:
    element: "Send a little love"
    direction: DOWN
    timeout: 15000
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element: "Optional pulse note"
    direction: DOWN
    timeout: 15000
    waitToSettleTimeoutMs: 1000
- tapOn: ${J_PULSE_BUTTON}
- tapOn: "Optional pulse note"
- inputText: ${J_PULSE_NOTE}
- runFlow: ../shared/hide-keyboard.yaml
- scrollUntilVisible:
    element: ${J_PULSE_SEND_LABEL}
    direction: DOWN
    timeout: 15000
    waitToSettleTimeoutMs: 1000
# The confirmation toast only shows for a few seconds; don't let the tap wait out the
# toast's animation before checking for it.
- tapOn:
    text: ${J_PULSE_SEND_LABEL}
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: ${J_PULSE_SENT_TITLE}
    timeout: 15000

- scrollUntilVisible:
    element: "Recent pulses"
    direction: DOWN
    timeout: 15000
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element: ${J_PULSE_NOTE}
    direction: DOWN
    timeout: 15000
- assertVisible: "From you"
