appId: com.leader282.tara
name: "Journey: create a photo capsule with the in-app camera"
tags:
  - journey
  - capsules
  - media
---
- runFlow: ../shared/resume-to-tabs.yaml
- tapOn:
    id: "tab-capsules"
- extendedWaitUntil:
    visible: "Memory capsules"
    timeout: 20000
- tapOn: "Create capsule"
- extendedWaitUntil:
    visible: "Create memory capsule"
    timeout: 15000
- tapOn: "Capsule title"
- inputText: ${J_CAPSULE_TITLE}
- runFlow: ../shared/hide-keyboard.yaml

- scrollUntilVisible:
    element: "Take a photo or video"
    direction: DOWN
    timeout: 10000
- tapOn: "Take a photo or video"
# Android asks for the camera the first time; release runs grant it at launch.
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- extendedWaitUntil:
    visible: "Take photo"
    timeout: 20000
# Each tap of the shutter adds another photo without leaving the camera.
- tapOn: "Take photo"
- extendedWaitUntil:
    visible: "Add 1 capture"
    timeout: 15000
- tapOn: "Take photo"
- extendedWaitUntil:
    visible: "Add 2 captures"
    timeout: 15000
- tapOn: "Add 2 captures"

- extendedWaitUntil:
    visible: "Attached photo 2"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Uploading"
    timeout: 60000
- assertNotVisible: "Upload failed"
# Selecting a photo offers replace and delete.
- tapOn: "Attached photo 1"
- scrollUntilVisible:
    element: "Delete"
    direction: DOWN
    timeout: 10000
- assertVisible: "Replace"
- tapOn: "Delete"
- assertNotVisible: "Attached photo 2"

- scrollUntilVisible:
    element: "Save capsule"
    direction: DOWN
    timeout: 10000
- tapOn: "Save capsule"
- extendedWaitUntil:
    visible: "Capsule detail"
    timeout: 20000
# The "Capsule sealed" toast covers the header back button until it hides.
- extendedWaitUntil:
    notVisible: "Capsule sealed"
    timeout: 15000
- assertVisible: ${J_CAPSULE_TITLE}
- scrollUntilVisible:
    element: "Your capsule photo"
    direction: DOWN
    timeout: 20000
- tapOn: "Back to capsules"
- extendedWaitUntil:
    visible: ${"Open memory capsule " + J_CAPSULE_TITLE}
    timeout: 15000
