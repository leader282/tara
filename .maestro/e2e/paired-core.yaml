appId: com.leader282.tara
name: Paired couple core product surface
tags:
  - e2e
  - paired
  - presence
  - rituals
  - capsules
  - timeline
  - settings
---
- runFlow: ../shared/launch-app.yaml
- runFlow: ../shared/sign-in.yaml

- extendedWaitUntil:
    visible:
      id: "couple-home"
    timeout: 30000
- assertVisible: ${E2E_PARTNER_NAME}
- scrollUntilVisible:
    element:
      text: "Send a little love"
    direction: DOWN
    timeout: 10000

- scrollUntilVisible:
    element:
      text: "Optional pulse note"
    direction: DOWN
    timeout: 10000
- tapOn: "Send a hug pulse"
- tapOn: "Optional pulse note"
- inputText: ${"A tiny E2E hello from " + E2E_RUN_ID}
- runFlow: ../shared/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      text: ${"Send hug to " + E2E_PARTNER_NAME}
    direction: DOWN
    timeout: 10000
- tapOn: ${"Send hug to " + E2E_PARTNER_NAME}
# The confirmation toast is transient; allow generous time under load so a slow
# round-trip to Supabase doesn't miss it.
- extendedWaitUntil:
    visible: ${"Hug sent to " + E2E_PARTNER_NAME}
    timeout: 30000

- tapOn:
    id: "tab-rituals"
- extendedWaitUntil:
    visible: "Small prompts you both answer in your own time, from wherever you are."
    timeout: 20000
- assertVisible: "What is one tiny thing that helped you feel close today?"
- runFlow:
    when:
      visible: "Ritual response"
    commands:
      - tapOn: "Ritual response"
      - inputText: ${"E2E ritual answer " + E2E_RUN_ID}
      - runFlow: ../shared/hide-keyboard.yaml
      - tapOn: "Save my answer"
- runFlow:
    when:
      visible: "Your answer is saved."
    commands:
      - assertVisible: "You'll see both answers when you've both completed this."
- runFlow:
    when:
      visible: "Both answers are revealed"
    commands:
      - assertVisible: ${"E2E ritual answer " + E2E_RUN_ID}

- tapOn:
    id: "tab-capsules"
- extendedWaitUntil:
    visible: "Memory capsules"
    timeout: 20000
- assertVisible: ${E2E_READY_CAPSULE_TITLE}
- tapOn: ${"Open memory capsule " + E2E_READY_CAPSULE_TITLE}
- extendedWaitUntil:
    visible: "Capsule detail"
    timeout: 15000
- runFlow:
    when:
      visible: "Open capsule"
    commands:
      - tapOn: "Open capsule"
- extendedWaitUntil:
    visible: ${"E2E " + E2E_RUN_ID + " opened capsule note"}
    timeout: 15000
# The "Capsule opened" toast covers the header back button until it hides.
- extendedWaitUntil:
    notVisible: "Capsule opened"
    timeout: 15000
- tapOn: "Back to capsules"

- extendedWaitUntil:
    visible: "Memory capsules"
    timeout: 15000
- tapOn: "Create capsule"
- extendedWaitUntil:
    visible: "Create memory capsule"
    timeout: 15000
- tapOn: "Capsule title"
- inputText: ${"E2E UI capsule " + E2E_RUN_ID}
- tapOn: "Capsule note"
- inputText: "Created through Maestro"
- runFlow: ../shared/hide-keyboard.yaml
# The unlock date defaults to tomorrow, which is all this flow needs.
- scrollUntilVisible:
    element:
      text: "Save capsule"
    direction: DOWN
    timeout: 10000
- tapOn: "Save capsule"
- extendedWaitUntil:
    visible: "Capsule detail"
    timeout: 20000
- assertVisible: ${"E2E UI capsule " + E2E_RUN_ID}
- tapOn: "Back to capsules"
- runFlow: ../shared/launch-app.yaml
- runFlow: ../shared/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "couple-home"
    timeout: 30000

- tapOn:
    id: "tab-timeline"
- extendedWaitUntil:
    visible: "Your private timeline"
    timeout: 20000
- assertVisible: "Memory capsule created"

# Settings lives in the home header.
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "couple-home"
    timeout: 15000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Choose what feels calm, private, and supportive."
    timeout: 15000
- assertVisible: "Profile"
- scrollUntilVisible:
    element:
      text: "Privacy center"
    direction: DOWN
    timeout: 10000
- assertVisible: "Privacy center"
- tapOn: "Privacy center"
- extendedWaitUntil:
    visible: "How your space stays private"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Open account and safety controls"
    direction: DOWN
    timeout: 10000
- tapOn: "Open account and safety controls"
- extendedWaitUntil:
    visible: "Current account status"
    timeout: 15000
- assertVisible: "Paired"
