appId: com.leader282.tara
name: Account safety export deletion and archive
tags:
  - e2e
  - account
  - destructive
---
- runFlow: ../shared/launch-app.yaml
- runFlow: ../shared/sign-in.yaml

- extendedWaitUntil:
    visible:
      id: "couple-home"
    timeout: 30000
# Settings lives in the home header.
- tapOn: "Settings"

- extendedWaitUntil:
    visible: "Choose what feels calm, private, and supportive."
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Account and safety"
    direction: DOWN
    timeout: 10000
- tapOn: "Account and safety"

- extendedWaitUntil:
    visible: "Current account status"
    timeout: 15000
- assertVisible: "Paired"

- scrollUntilVisible:
    element:
      text: "Request data export"
    direction: DOWN
    timeout: 10000
- tapOn: "Request data export"
- extendedWaitUntil:
    visible: "Request already in progress"
    timeout: 15000

- scrollUntilVisible:
    element:
      text: "Type DELETE to continue"
    direction: DOWN
    timeout: 10000
- tapOn: "Type DELETE to continue"
- inputText: "DELETE"
- runFlow: ../shared/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      text: "Deletion reason"
    direction: DOWN
    timeout: 10000
- tapOn: "Deletion reason"
- inputText: ${"E2E deletion coverage " + E2E_RUN_ID}
- runFlow: ../shared/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      text: "Request account deletion"
    direction: DOWN
    timeout: 10000
- tapOn: "Request account deletion"
# The success toast is transient, so assert on the persistent state instead.
# The cancel button only exists while a request is pending, so finding it
# confirms the deletion request was submitted.
- scrollUntilVisible:
    element:
      text: "Cancel pending deletion request"
    direction: DOWN
    timeout: 20000
- tapOn: "Cancel pending deletion request"
# Canceling keeps the latest request visible with a canceled status label.
- scrollUntilVisible:
    element:
      text: "Current request: Canceled"
    direction: DOWN
    timeout: 20000

# Requesting account deletion archives the active couple, so the account status
# now reports the user is no longer paired. This is the same archive outcome the
# explicit unpair button produces (the two destructive paths are mutually
# exclusive within a single paired session).
- scrollUntilVisible:
    element:
      text: "Current account status"
    direction: UP
    timeout: 10000
- assertVisible: "Not paired"
