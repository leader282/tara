appId: com.leader282.tara
---
- stopApp
- clearState
# Runners pass E2E_BUILD=release when a release build is installed. It carries its own JS
# bundle, so it starts straight into the app without the dev client's launcher or menu.
- runFlow:
    when:
      true: ${typeof E2E_BUILD !== 'undefined' && E2E_BUILD === 'release'}
    commands:
      - launchApp
      - extendedWaitUntil:
          visible: "Welcome back|Loading Tara...|Loading your profile...|Preparing your couple space...|Your private space"
          timeout: 60000
- runFlow:
    when:
      true: ${typeof E2E_BUILD === 'undefined' || E2E_BUILD !== 'release'}
    file: launch-dev-client.yaml
- runFlow: dismiss-anr.yaml
